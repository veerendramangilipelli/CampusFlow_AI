spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:22573}/${DB_NAME:campusflow_ai}?sslMode=REQUIRED
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRY_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}